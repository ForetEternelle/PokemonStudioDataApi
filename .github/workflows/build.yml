name: Test and build

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Test
        run: mise run test

      - name: Build
        run: mise run build

      - name: Validate OpenAPI specs
        run: |
          test -f wiki/public/api/openapi.json
          python3 -c "import json; json.load(open('wiki/public/api/openapi.json'))"

      - name: Build image
        run: docker build .
