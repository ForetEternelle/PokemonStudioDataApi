name: Release

on:
  release:
    types: [released]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/foreteternelle/pokemonstudiodataapi

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Test
        run: mise run test

      - name: Build
        run: mise run build

      - name: Generate OpenAPI specs
        run: mise run generate

      - name: Upload OpenAPI specs to release
        run: gh release upload ${{ github.ref_name }} build/psapi-openapi.json build/psapi-openapi.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
