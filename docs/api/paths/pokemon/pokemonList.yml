get:
  tags:
    - Pokemon
  summary: Get a list of pokemon
  description: This endpoint returns a list of pokemon.
  operationId: getPokemon
  parameters:
    - $ref: "../../parameters/lang.yml"
    - $ref: "../../parameters/scroll.yml#/size"
    - $ref: "../../parameters/pokemon-filter.yml#/lastId"
    - $ref: "../../parameters/pokemon-filter.yml#/lastForm"
    - $ref: "../../parameters/pokemon-filter.yml#/mainFormsOnly"
    - $ref: "../../parameters/pokemon-filter.yml#/query"
    - $ref: "../../parameters/pokemon-filter.yml#/types"
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            title: "PokemonScroll"
            allOf:
              - $ref: "../../schemas/Scroll.yml"
              - type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: "../../schemas/pokemon/PokemonThumbnail.yml"
    "400":
      $ref: "../../responses/InvalidParameterError.yml"
