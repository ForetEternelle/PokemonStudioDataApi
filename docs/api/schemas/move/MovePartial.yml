type: object
description: An object containing partial data of a pokemon move
required:
  - symbol
  - name
  - description
  - type
  - category
  - pp
  - power
  - accuracy
properties:

  symbol:
    type: string
    description: The symbol of the pokemon move
    example: "thunderbolt"

  name:
    type: string
    description: The translated name of the pokemon move
    example: "Thunderbolt"

  description:
    type: string
    description: The translated description of the pokemon move
    example: "A strong electric blast crashes down on the target."

  type:
    $ref: "../types/TypePartial.yml"

  category:
    type: string
    description: The category of the pokemon move
    enum: [physical, special, status]

  pp:
    type: integer
    description: The PP of the pokemon move
    example: 15

  power:
    type: integer
    description: The power of the pokemon move
    example: 90

  accuracy:
    type: integer
    description: The accuracy of the pokemon move
    example: 100