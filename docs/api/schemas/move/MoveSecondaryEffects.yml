MoveSecondaryEffects:
  type: object
  required:
    - chance
    - statusEffects
    - statStageChanges
  properties:
    chance:
      type: integer
      description: Global chance to apply secondary effects
      example: 30

    statusEffects:
      type: array
      items:
        $ref: "./MoveStatusEffect.yml"

    statStageChanges:
      type: array
      items:
        $ref: "./MoveStatStageChange.yml"