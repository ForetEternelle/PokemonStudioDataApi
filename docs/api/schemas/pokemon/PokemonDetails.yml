type: object
description: An object containing detailed data of a pokemon with its main form
required:
  - symbol
  - number
  - form
  - tags
  - customProperties
properties:
  symbol:
    type: string
    description: The symbol of the pokemon
    example: "pikachu"
  number:
    type: integer
    description: The number of the pokemon
    example: 25
  form :
    $ref: "./FormDetails.yml"
  tags:
    $ref: "../Tags.yml"
    description: Tags setted by the developer
  customProperties:
    $ref: "../CustomProperties.yml"
    description: Custom properties setted by the developer
