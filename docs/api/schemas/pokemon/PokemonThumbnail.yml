type: object
description: An object containing base information to display a pokemon
required:
  - symbol
  - name
  - number
  - form
  - image
  - type1
  - customProperties
  - tags
  - formCustomProperties
  - formTags
properties:
  symbol:
    type: string
    description: The symbol of the pokemon
    example: "pikachu"
  name:
    type: string
    description: The translated name of the first pokemon's form
    example: "Pikachu"
  number:
    type: integer
    description: The number of the pokemon
    example: 25
  form:
    type: integer
    description: The form of the pokemon
    example: 0
  image:
    type: string
    description: The image symbol of the pokemon
    example: "025"
  type1:
    description: The first type
    $ref: "../types/TypePartial.yml"
    nullable: false
  type2:
    $ref: "../types/TypePartial.yml"
    description: The second type
    nullable: true
  customProperties:
    $ref: "../CustomProperties.yml"
    description: Custom properties setted by the developer
  tags:
    $ref: "../Tags.yml"
    description: Tags setted by the developer
  formCustomProperties:
    $ref: "../CustomProperties.yml"
    description: Custom properties setted by the developer
  formTags:
    $ref: "../Tags.yml"
    description: Tags setted by the developer
